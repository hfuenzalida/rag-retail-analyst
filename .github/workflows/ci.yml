name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: >
          pytest app/tests -q
          --ignore=app/tests/test_integration_db.py
          --ignore=app/tests/test_integration_query.py
          --ignore=app/tests/test_integration_rag.py

  gates:
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_analyst
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_analyst"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_DB_URL: postgresql://postgres:postgres@localhost:5432/rag_analyst
      LOGFIRE_IGNORE_NO_CONFIG: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Initialize database schema and seed
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d rag_analyst -f backend/app/db/schema.sql
          cd backend && python -m app.db.seed

      - name: Config lint
        run: python infra/scripts/lint_config.py

      - name: Smoke tests
        run: python infra/scripts/run_smoke.py

      - name: Golden eval CI subset
        run: python infra/scripts/run_eval_ci.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

# Staging stack: production-like topology with masked demo data.
# Cloud LLM allowed with capped test keys; ingestion enabled for admin QA.
#
# Usage:
#   cp env.staging.example .env.staging
#   docker compose -f docker-compose.staging.yml up --build

services:
  postgres-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging-postgres}
      POSTGRES_DB: rag_analyst
    ports:
      - "5434:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
      - ../backend/app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_analyst"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    env_file:
      - path: .env.staging
        required: false
    environment:
      APP_ENV: staging
      APP_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-staging-postgres}@postgres-db:5432/rag_analyst
      APP_BASE_URL: http://localhost:3002
      APP_READ_ONLY: "false"
      APP_ENABLE_INGEST: "true"
      APP_RUNTIME_CONTROLS_PATH: /config/runtime-controls.yaml
    volumes:
      - ./flags/runtime-controls.yaml:/config/runtime-controls.yaml:ro
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend-ui:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8002
    depends_on:
      backend-api:
        condition: service_healthy

  seed-demo:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: python -m app.db.seed
    environment:
      APP_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-staging-postgres}@postgres-db:5432/rag_analyst
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: "no"

volumes:
  staging_postgres_data:

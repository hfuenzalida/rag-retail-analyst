# Preview stack: full stack minus local LLM hardware.
# Uses sanitized demo data; read-only; rate-limited cloud keys recommended.
#
# Usage:
#   cp env.preview.example .env.preview
#   docker compose -f docker-compose.preview.yml up --build

services:
  postgres-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-preview-postgres}
      POSTGRES_DB: rag_analyst
    ports:
      - "5433:5432"
    volumes:
      - preview_postgres_data:/var/lib/postgresql/data
      - ../backend/app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_analyst"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - path: .env.preview
        required: false
    environment:
      APP_ENV: preview
      APP_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-preview-postgres}@postgres-db:5432/rag_analyst
      APP_BASE_URL: http://localhost:3001
      APP_READ_ONLY: "true"
      APP_ENABLE_INGEST: "false"
      APP_RUNTIME_CONTROLS_PATH: /config/runtime-controls.yaml
    volumes:
      - ./flags/runtime-controls.yaml:/config/runtime-controls.yaml:ro
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend-ui:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
    depends_on:
      backend-api:
        condition: service_healthy

  seed-demo:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: python -m app.db.seed
    environment:
      APP_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-preview-postgres}@postgres-db:5432/rag_analyst
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: "no"

volumes:
  preview_postgres_data:
